# 启动配置：进程级参数，改了要重启。
Listen = ':1101'
LogDir = 'data/log'
Console = true
Debug = false
# 前置代理：为 true 时信任转发头里的真实 IP
Proxy = false
RealIP = ''
Cors = false
# 动态配置轮询间隔
ReloadInterval = '2s'
# 缓存目录（部署形态，不参与热更）
CacheDir = 'data/cache'
# 自定义 DNS（留空自动判断；Android/Termux 上会自动回落到 223.5.5.5:53）
DNSServer = ''

# 酷我来源（启动期参数，改了要重启）
[Kw]
# anti = 免密钥的 antiserver 接口（默认，匿名可用）
# mobi = 需要 8 字节 DES 密钥的 mobi 接口
Strategy = 'anti'
# 留空则用内置默认地址：anti → https://antiserver.kuwo.cn
BaseURL = ''
# mobi 策略用的 DES 密钥；留空则 mobi 不可用
Key = ''

# 网易云取链
[Wy]
# 官方接口匿名只返回 url:null，取直链必须借第三方签名服务。
# 默认关闭：公共实例从部分网络访问时通时不通（Cloudflare 握手失败/超时）。
# 自建 Meting 之类服务后，把地址填进 AggURL 并置 Agg = true。
Agg = false
# 自定义签名服务地址；留空用内置默认值（GD 音乐台）
AggURL = ''
# 登录态 Cookie（形如 MUSIC_U=xxx）。填了它，官方接口就能直接给地址，不必借第三方
Cookie = ''

# QQ 音乐取链
[Tx]
# 匿名拿不到 purl（服务端只回 104003），必须填登录态 Cookie
# 内容形如：uin=o0123456789; qqmusic_key=xxx
Cookie = ''
# 也可只填这两项（从 Cookie 里取）：Uin 是数字 QQ 号，Ukey 是 qqmusic_key
Uin = ''
Ukey = ''
