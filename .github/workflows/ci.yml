name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: 校验 go.sum 与 go.mod 一致
        run: go mod verify

      # 格式检查目前只报告、不阻塞（见 HANDOFF.md「已知问题」）。
      # 修法是本地跑一次 gofmt -w . 然后把它改回阻塞。
      - name: gofmt（仅报告）
        continue-on-error: true
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::warning::以下文件未格式化：$out"
            gofmt -d $out | head -80
          else
            echo "格式检查通过"
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: 模糊测试冒烟（20 秒）
        run: go test ./pkg/lrcutil -run '^$' -fuzz '^FuzzParseLrcx$' -fuzztime 20s
        continue-on-error: true
