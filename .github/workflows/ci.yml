name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: 模糊测试冒烟（20 秒）
        run: go test ./pkg/lrcutil -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s
        continue-on-error: true
