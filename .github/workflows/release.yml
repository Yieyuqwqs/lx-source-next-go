name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, name: linux-amd64 }
          - { goos: linux,   goarch: arm64, name: linux-arm64 }
          - { goos: darwin,  goarch: arm64, name: darwin-arm64 }
          - { goos: darwin,  goarch: amd64, name: darwin-amd64 }
          - { goos: windows, goarch: amd64, name: windows-amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          out="lxsrcs-${{ matrix.name }}"
          if [ "${GOOS}" = "windows" ]; then
            out="${out}.exe"
          fi
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/lxsrcs
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: lxsrcs-${{ matrix.name }}
          path: |
            lxsrcs-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出产物
        run: ls -la dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="nightly-$(date +%Y%m%d%H%M)"
          fi
          gh release create "$tag" dist/* \
            --title "$tag" \
            --notes-file CHANGELOG.md \
            || gh release upload "$tag" dist/* --clobber
