name: smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: 端到端冒烟
        run: bash scripts/smoke.sh

      - name: 探测第三方公开 API（诊断用）
        run: bash scripts/probe-apis.sh
        continue-on-error: true
